name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file exe
        run: dotnet publish src/Glint.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist
      - name: Checksum and package manifests
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Glint.exe -Algorithm SHA256).Hash
          "$hash  Glint.exe" | Set-Content dist/Glint.exe.sha256
          $ver = ([xml](Get-Content src/Glint.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          ./tools/make-manifests.ps1 -Version $ver -Sha256 $hash -Out dist/manifests
          Compress-Archive dist/manifests/* dist/winget-manifests.zip -Force
          Copy-Item dist/manifests/scoop/glint.json dist/glint.json
      - uses: actions/upload-artifact@v4
        with:
          name: Glint-win-x64
          path: dist/Glint.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Glint.exe
            dist/Glint.exe.sha256
            dist/glint.json
            dist/winget-manifests.zip
