name: demo-screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/demo.yml']
permissions:
  contents: write
jobs:
  demo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          dotnet publish src/Glint.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist *> shots\publish-log.txt
          if ($LASTEXITCODE -ne 0) { Get-Content shots\publish-log.txt; exit 1 }
      - name: Sample files
        continue-on-error: true
        shell: pwsh
        run: |
          $d = "$env:USERPROFILE\Developer\fsearch"
          New-Item -ItemType Directory -Force "$d\src","$env:USERPROFILE\Documents\College","$env:USERPROFILE\Pictures\Screenshots" | Out-Null
          Set-Content "$d\src\main.rs" "fn main() {`n    // TODO: wire up the daemon`n    let dir = apply_dir(\"~\");`n}"
          Set-Content "$d\src\index.rs" "pub fn apply_dir(p: &str) -> String {`n    // TODO: handle symlinks`n    p.to_string()`n}"
          Set-Content "$d\Cargo.toml" "[package]`nname = `"fsearch`""
          Set-Content "$d\README.md" "# fsearch"
          Copy-Item tools\samples\DBMS-lab-report.pdf,tools\samples\placement-notes.docx "$env:USERPROFILE\Documents\College\"
          Set-Content "$env:USERPROFILE\Documents\College\maintenance-notes.md" "x"
          Copy-Item tools\samples\resume-final-v3.pdf "$env:USERPROFILE\Documents\"
          1..4 | % { [IO.File]::WriteAllBytes("$env:USERPROFILE\Pictures\Screenshots\Screenshot 2026-10-0$_.png", (New-Object byte[] (2MB))) }
      - name: Run demo
        continue-on-error: true
        shell: pwsh
        run: |
          $args = '--demo "' + "$pwd\shots" + '" "mian" "raedme" "resume ext:pdf" "grep:normalization ext:pdf" "grep:Harmonic" "grep:TODO in:~/Developer" "maintenence"'
          $p = Start-Process dist\Glint.exe -ArgumentList $args -PassThru
          if (-not $p.WaitForExit(420000)) { $p.Kill() }
          "exit=$($p.ExitCode)" | Out-File -Append shots\run-log.txt
          Get-ChildItem -Recurse shots | Out-File -Append shots\run-log.txt
          Get-Content shots\demo-log.txt
      - name: Commit shots to demo-shots branch
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -ErrorAction SilentlyContinue . -Filter *.log | Out-Null
          git config user.name "glint-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan demo-shots
          git rm -rf --cached . | Out-Null
          git add -f shots
          git commit -m "Demo screenshots $env:GITHUB_SHA"
          git push -f origin demo-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glint-demo
          path: shots
